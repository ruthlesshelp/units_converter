[behave]
# Configuration for behave BDD testing
paths = features
format = pretty
show_skipped = false
show_timings = true
color = true
stop = false
logging_level = INFO
logging_format = %(levelname)-8s %(name)-10s %(message)s

# Tags to run or skip
# default_tags = ~@skip
# tags = @smoke,@regression

